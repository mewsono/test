name: Build debug APK

# Manual only: this workflow never builds on push or pull request.
# Run it from the Actions tab ("Run workflow") or with:
#   gh workflow run "Build debug APK"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Ubuntu runner image ships the Android SDK; just install what we pin.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cp local.properties app/local.properties

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :mobile:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # The job log isn't always reachable from CI-less environments, so bubble
      # compiler errors up as check-run annotations too.
      # The job log isn't reachable from every environment, so bubble compiler
      # errors up as check-run annotations too.
      - name: Surface compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^(e: |.*error:|FAILURE:|Caused by:)' /tmp/build.log 2>/dev/null \
            | sort -u | head -40 | while IFS= read -r line; do
                echo "::error::${line//%/%25}"
              done
          echo "::notice::captured $(grep -cE '^(e: |.*error:)' /tmp/build.log 2>/dev/null || echo 0) compiler error lines"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixiv-debug-apk
          path: app/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/mobile/build/reports/**
          if-no-files-found: ignore
